version: '3.8'

services:
  # 1. PostgreSQL Persistence Layer
  db:
    image: postgres:15-alpine
    container_name: aigra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: aigraops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend & SRE Autonomous Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aigra_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/aigraops
      - SECRET_KEY=supersecretkeyforproduction
      - ENVIRONMENT=production
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  # 3. Next.js 16 Production Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aigra_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

  # 4. Prometheus Metrics Scraper
  prometheus:
    image: prom/prometheus:latest
    container_name: aigra_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend

volumes:
  pgdata:
